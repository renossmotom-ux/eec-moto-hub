name: Make photo thumbnails
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/make_thumbs.py", ".github/workflows/thumbs.yml"]
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/make_thumbs.py
      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json data/thumbs
          git diff --cached --quiet && exit 0
          git commit -m "Update photo thumbnails"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
