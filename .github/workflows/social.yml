name: Social media suppliers (logos, photos, website contacts)
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["data/social.json", ".github/workflows/social.yml"]
defaults:
  run:
    shell: bash
permissions:
  contents: write
concurrency:
  group: social-${{ github.ref }}
  cancel-in-progress: true
jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow cairosvg playwright && python -m playwright install --with-deps chromium
      # Only the social-media suppliers that show their own website
      - id: ids
        run: echo "ids=$(python -c "import json;print(' '.join(r['id'] for r in json.load(open('data/factories.json'))+json.load(open('data/helmets.json')) if r.get('via')=='social' and r.get('web')))")" >> "$GITHUB_OUTPUT"
      - run: python tools/fetch_logos.py ${{ steps.ids.outputs.ids }} | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python tools/fetch_photos.py ${{ steps.ids.outputs.ids }} | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python tools/make_thumbs.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python tools/fetch_contacts.py ${{ steps.ids.outputs.ids }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/logos data/logos.json data/photos.json data/thumbs data/thumbs.json data/contacts.json
          git diff --cached --quiet && exit 0
          git commit -m "Logos, photos and website contacts for social media suppliers [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
