name: Fetch company contacts
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_contacts.py", ".github/workflows/contacts.yml"]
permissions:
  contents: write
concurrency:
  group: contacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: set -o pipefail; python tools/fetch_contacts.py --debug | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/contacts.json debug
          git diff --cached --quiet && exit 0
          git commit -m "Update company contacts [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
