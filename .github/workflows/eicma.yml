name: Fetch EICMA Chinese exhibitors
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_eicma.py", ".github/workflows/eicma.yml"]
permissions:
  contents: write
concurrency:
  group: eicma-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eicma:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: set -o pipefail; python tools/fetch_eicma.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/eicma.json data/eicma_china.json
          git diff --cached --quiet && exit 0
          git commit -m "Update EICMA exhibitors [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
