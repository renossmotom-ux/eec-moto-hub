name: Fetch factory photos
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/fetch_photos.py", ".github/workflows/photos.yml"]
  schedule:
    - cron: "0 3 1 * *"   # refresh monthly
permissions:
  contents: write
concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow playwright && python -m playwright install --with-deps chromium
      - run: python tools/fetch_photos.py | tee photos.log; tail -1 photos.log >> "$GITHUB_STEP_SUMMARY"
      - run: python tools/make_thumbs.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/photos.json data/thumbs data/thumbs.json
          git diff --cached --quiet && exit 0
          git commit -m "Update factory photos"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
