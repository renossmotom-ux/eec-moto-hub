name: Probe extra contact sources
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe_sources.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: mkdir -p debug && python tools/probe_sources.py debug/probe.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A debug
          git diff --cached --quiet && exit 0
          git commit -m "Probe extra sources [skip ci]"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
