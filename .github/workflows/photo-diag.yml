name: Photo diagnostics
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/photo-diag.yml"]
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - run: python tools/fetch_photos.py --diag deep-metal-moto kawai-motor
